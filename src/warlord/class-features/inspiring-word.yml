system:
  description:
    value: <p>Your words encourage others to fight on. At 1st level, you can use a bonus action to shout at another creature within 30 feet that can hear you. Your target regains hit points equal to one roll of its Hit Die + your Leadership modifier, though it does not expend a Hit Die as part of this ability. You can use this feature the number of times indicated in the Inspiring Word column on the Warlord table. You regain all expended uses when you finish a short or long rest.</p>
