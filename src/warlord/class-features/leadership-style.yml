system:
  description:
    value: '<p>At 1st level, you choose your Leadership Style. It determines your Leadership Ability Score and grants additional benefits. Captain: You lead with personality, bravery, and boldness. Charisma is your Leadership Score. You also gain proficiency in heavy armor and your choice of either Intimidation or Persuasion. Mentor: You lead through wise counsel. Wisdom is your Leadership Score. When another creature within 15 feet that can hear you misses an attack or fails an ability check, you can use your reaction to grant it a 1d4 bonus to its roll. Strategist: You lead with cunning tactical insight. Intelligence is your Leadership Score. After you roll initiative, you can switch places in initiative order with another willing creature.</p>'
