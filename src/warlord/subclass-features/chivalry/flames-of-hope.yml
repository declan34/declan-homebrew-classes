    value: '<p>Once between each short or long rest you can use your action to let forth a heroic cry that inflames the hearts of your allies and inspires terror in your foes. Creatures that can hear you within 30 feet gain the corresponding effect below: Allies. Friendly creatures gain temporary hit points equal to your Exploit Die + your Leadership modifier. While these last, the creature cannot be Charmed or Frightened. Enemies. Hostile creatures must make a Wisdom saving throw or be Frightened of you. They repeat the saving throw at the end of each of their turns and when they take damage, ending the effect on a success.</p>'
