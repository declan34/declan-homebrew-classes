  description:
    value: <p>It is your duty to uphold the law and defend the weak. When a creature you can see within 15 feet is hit by an attack, you can use your reaction to issue it a defensive order, imposing disadvantage on the triggering attack, possibly turning a hit into a miss. You can use this reaction a number of times equal to your Leadership modifier (minimum of once), and you regain all expended uses when you finish a long rest. When you have no uses, you can expend an Inspiring Word to use it again.</p>
