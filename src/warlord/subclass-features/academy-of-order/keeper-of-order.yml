system:
  description:
    value: <p>You employ your tactical training to uphold law and order in civilized society. You gain proficiency in either Insight or Investigation, and whenever you make an ability check with either of these skills, you can choose to use your Leadership Ability for the check. In addition, when you reduce a creature to 0 hit points with a non-lethal melee attack, you can use a bonus action on that turn to restrain them with a net, rope, manacles, or another similar object. The DC to escape this restraint is equal to your Exploit save DC unless its innate escape DC was already higher.</p>
