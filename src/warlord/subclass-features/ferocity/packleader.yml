img: icons/svg/item-bag.svg
system:
  description:
    value: <p>You lead your pack in the hunt. As a bonus action, you can mark a creature you can see within 30 feet as your Prey. It remains your Prey for 1 minute, but the effect ends early if your Prey is reduced to 0 hit points, you are Incapacitated, or you mark another creature as your Prey. Any creature you target with Inspiring Word or a Tactical Exploit adds your Exploit Die to the first attack roll it makes against your Prey before the start of your next turn. You can mark a creature as your Prey a number of times equal to your Leadership modifier (minimum of once). You regain one expended use when you finish a short rest, and all expended uses when you finish a long rest.</p>
