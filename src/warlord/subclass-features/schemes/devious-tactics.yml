  description:
    value: <p>You have no qualms about leaving others in danger. When a creature you can see targets you with an attack or forces you to make a saving throw, you can use your reaction to force a creature within 5 feet of you (other than the attacker) to make a Dexterity saving throw. On a failure, you switch places, and it becomes the target of that attack or saving throw. The creature can choose to fail.</p>
