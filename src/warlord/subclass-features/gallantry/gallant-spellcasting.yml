system:
  description:
    value: '<p>Your talent in poetry and music allows you to produce spells, much like the Bard does. You gain the following benefits: Spell Slots. The Gallant Spellcasting table shows how many spell slots you have to cast your spells of 1st-level and higher. To cast a spell, you must expend a slot of that spell''s level or higher. You regain all expended spell slots when you finish a long rest. Spells Known of 1st-Level and Higher. You know three 1st-level spells of your choice from the Gallantry spell list. The Spells Known column of the Gallant Spellcasting table shows when you learn more spells. When you gain a level, you can replace one of your Spells Known with another spell from the Gallantry spell list. Spellcasting Focus. You can use any musical instrument you are proficient with as a spellcasting focus for your spells. Spellcasting Ability. Use your Leadership modifier when setting the saving throw DC or making a spell attack roll for any Gallantry spells you know through this feature: Spell save DC = 8 + your Proficiency Bonus + your Leadership modifier; Spell attack modifier = your Proficiency Bonus + your Leadership modifier.</p>'
