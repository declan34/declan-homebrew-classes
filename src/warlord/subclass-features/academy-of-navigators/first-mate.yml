    value: <p>You inspire loyalty in the most dastardly scallywags. When you use recruit mercenary, you can designate them as your First Mate. When you do, you can regain your Exploit Die as normal, the Mercenary gains the benefits of Seafarer and is part of your Crew without counting against your total Crew. You can only have one First Mate at a time. In place of designating a Mercenary, you can designate a different member of your Crew as First Mate. They gain the benefits of Seafarer and don&#x27;t count against your total Crew.</p>
