  description:
    value: <p>Without established authority to turn to on the sea you have become a shrewd negotiator. As an action, you can expend a use of Inspiring Word and speak to a creature within 15 feet that can see, hear, and understand you, improving its attitude toward you by one. For example, a Hostile creature becomes Indifferent, and an Indifferent creature becomes Friendly. Once you use this feature on a creature it is immune to its effects for 24 hours. You cannot use this feature on a creature that you or your allies have attacked within the last 24 hours.</p>
