  description:
    value: <p>Your presence on the field of battle inspires fear in the hearts of your enemies. As a bonus action, you can expend a use of Inspiring Word to force one creature that can see you within 30 feet to make a Wisdom saving throw. On a failed save, it is Frightened of you for 1 minute. If this Frightened creature sees you take damage, the effect ends. If the creature flees and is no longer in your line of sight, it can use its action to automatically end this effect.</p>
