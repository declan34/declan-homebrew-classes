    value: '<p>You have a gift for identifying weak points. When you take the Search action, you can focus on a creature you can see within 30 feet (DC = 8 + its Challenge Rating). If you have seen it get hit by an attack, add your Warlord level to this roll. On a success, you learn one characteristic of your choice from the list below. On a failure, you can''t use this feature on this creature again until you see it get hit by another attack: Armor Class; Highest Ability Score; Lowest Ability Score; All Special Senses; Resistances, Immunities, &amp; Vulnerabilities; One Trait or Action from its stat block.</p>'
