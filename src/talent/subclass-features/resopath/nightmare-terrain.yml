    value: <p>14th-level Resopath Feature</p><p>Terrain you shape with your mind is capable of harming your enemies. At the start of each of your turns while your Manipulate Terrain feature is active, you can select up to three creatures you can see 1n the area affected</p><p>by that feature and shape the ground around them into attacking weapons (no action required). Each creature must succeed on a Dexterity saving throw against your talent power save DC or take bludgeoning, piercing, or slashing damage (your choice) equal to your talent level.</p><p>24 TELEKINETIC</p><p>Your psionic powers allow you to physically manipulate other objects and creatures. All the world is a puppet</p><p>show and you are the puppet master, pulling invisible strings that can send stones, people, and even buildings flying. ‘Telekinetics are sometimes called movers, and those who undertake the ‘Telekinetic specialization do so at the Academy of Motion.</p>
