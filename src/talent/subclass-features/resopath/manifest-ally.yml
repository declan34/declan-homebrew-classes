system:
  description:
    value: <p>6th-level Resopath Feature</p><p>The power of your mind creates one or more living creatures that come to your aid. As a bonus action, you gain strain to create a soulless creature with the statistics of a Beast of your choice, whose challenge rating is no higher than your talent level divided by 3 (rounded down). The strain you gain equals the creature’s challenge rating (minimum 1).</p><p>The creature appears in an unoccupied space of your choice within 30 feet of you that you can see, and acts after you on your initiative count. The creature can understand any languages you speak and follows your commands to the best of their ability. If you don’t issue any commands to the creature, they defend themself from hostile creatures but otherwise take no actions. Your manifested ally disappears if they are reduced to 0 hit points, if you die, if you use this feature again to create another ally, or after 10 minutes.</p>
