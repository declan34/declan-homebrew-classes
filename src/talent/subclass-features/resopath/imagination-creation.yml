  description:
    value: <p>10th-level Resopath Feature</p><p>You make objects you need appear from nowhere.</p><p>As an action, you create any Large or smaller mundane object, which appears in an unoccupied space within</p><p>5 feet of you, with you touching the object. You can</p><p>use this feature to create a copy of any object you have touched, such as a key or a statue of a specific dragon. This feature can’t be used to make functional spell components.</p><p>The object you create disappears if you stop touching it for 5 minutes or until you use this feature again. You can use this feature a number of times equal to your Intelligence modifier (minimum once), regaining all uses when you finish a long rest.</p>
