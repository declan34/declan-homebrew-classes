    value: <p>10th-level Telepath Feature</p><p>You can facilitate an incredible psychic connection between yourself and other creatures. When you forge a telepathic link with your Greater Telepathy feature, each linked creature gains the following benefits:</p><p>¢ ‘The creature can choose to hear, smell, and see what any other linked creature experiences.</p><p>¢ Each creature can take the Help action as a bonus action to aid another linked creature.</p><p>¢ A creature can use the Help action to grant advantage on another linked creature’s attack roll even if the creature taking the Help action isn’t within 5 feet of the target of the attack.</p>
