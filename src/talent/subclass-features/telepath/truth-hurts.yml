    value: <p>14th-level Telepath Feature</p><p>As you open up the minds of your enemies, you cause their secrets to spill forth. Whenever a creature fails a saving throw against a telepathy power you manifest, you can choose one of the following options:</p><p>¢ You gain any amount of strain, then deal psychic damage to the creature equal to 2d8 for each strain you gain this way.</p><p>* You gain 2 strain to telepathically ask the creature one question, which they answer telepathically, honestly, and fully to the best of their ability. A creature that can’t be charmed is immune to this effect.</p><p>28 MAVERICK You don’t belong to a talent academy. Whether you</p><p>rejected the offer when it came your way, or you</p><p>don’t even know such places exist, you make no</p><p>special distinction between the powers you wield. By undertaking the Maverick specialization, you hone innate abilities that make any power you manifest more effective.</p>
