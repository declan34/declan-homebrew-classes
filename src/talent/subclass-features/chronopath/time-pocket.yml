    value: <p>14th-level Chronopath Feature</p><p>You temporarily remove a creature from space and time with your mind. As an action, you gain 3 strain and focus your mind on bending time around a creature you can see within 120 feet of you, which must make a Charisma saving throw against your talent power save DC. On a failed save, the creature takes 6d10 psychic damage and disappears, reappearing at the end of your turn 1d4 + | rounds later. The creature reappears in the space it previously occupied, or the nearest unoccupied space. On a success, the creature takes half as much damage and their speed is halved until the end of their next turn.</p><p>18 METAMORPH</p><p>Your brain allows you to alter a creature’s body chemistry, letting you close wounds, grant superpowers, and even bring back the dead with a mere touch of the mind. Metamorphs are sometimes called changers, and those who make a formal study of the Metamorph specialization do so at the Academy of Body.</p>
