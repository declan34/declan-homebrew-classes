    value: <p>10th-level Chronopath Feature</p><p>At the beginning of a fight, you bend time to your advantage. If you are surprised at the start of combat and aren't incapacitated, you can act normally on your first turn. You can also gain | strain to allow a surprised creature within 90 feet of you that you can see to act normally on their first turn.</p><p>Additionally, whenever you roll initiative, you can switch the initiative count of two creatures you can see within 90 feet of you that rolled initiative at the same time as you.</p>
