  description:
    value: <p>6th-level Chronopath Feature</p><p>You rapidly advance the age of objects with your mind, causing them to turn to dust. You can use an action</p><p>to gain | strain while touching a mundane object not carried or worn by another creature. If the object is Medium or smaller, it disintegrates into a pile of dust.</p><p>If the object is Large or bigger, you disintegrate a 5-foot- cubic portion of the object.</p><p>Additionally, while touching a Construct, you can use an action to gain strain up to your proficiency bonus. The Construct must make a Wisdom saving throw against your talent power save DC, taking 2d10 necrotic damage for each strain you gain on a failed save, or half as much damage on a successful one.</p>
