    value: <p>2nd-level Telekinetic Feature</p><p>By altering the arc of incoming attacks, you ward yourself or your allies against those attacks. When you</p><p>or a creature you can see within 30 feet of you is hit by an attack, you can use a reaction to give the target of</p><p>the attack a bonus to AC. This bonus is equal to your Intelligence modifier (minimum 1), is effective against the triggering attack, and lasts until the start of your next turn. You can use this feature a number of times equal to your Intelligence modifier (minimum once), regaining all uses when you finish a long rest.</p>
