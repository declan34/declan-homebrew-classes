    value: <p>14th-level Metamorph Feature</p><p>Any creature that benefits from your Psionic Toughness feature gains the following additional benefits for | hour:</p><p>¢ ‘The creature is immune to disease, poison damage, and the poisoned condition.</p><p>¢ ‘The creature’s speed increases by 10 feet.</p><p>¢ Once on each of the creature’s turns when they deal damage to a target with an attack, power, or spell, they can deal extra psychic damage to the target equal to your Intelligence modifier (minimum | damage).</p><p>20 PYROKINETIC</p><p>By interacting with the explosive energy found in</p><p>all things, you can create and manipulate fire with your mind. ‘To you, the flames you wield might be a beautiful work of art, a representation of your burning passion or rage, or simply a tool you use to do your job. Pyrokinetics are sometimes called burners, and those who take up the Pyrokinetic specialization do so at the Academy of Fire.</p>
