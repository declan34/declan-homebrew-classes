    value: <p>2nd-level Metamorph Feature</p><p>Your touch enhances a creature’s toughness. As an action, you touch one creature (which can be yourself) and confer the following benefits to them for | hour:</p><p>° The creature’s hit point maximum and current hit points increase by a number equal to your Intelligence modifier + your talent level (minimum 1).</p><p>¢ The creature has advantage on death saving throws.</p><p>You can use this feature a number of times equal to your Intelligence modifier (minimum once), regaining all uses when you finish a long rest.</p><p>THE TALENT | THE TALENT</p>
