    value: <p>2nd-level Metamorph Feature</p><p>When you roll a manifestation die to learn a new metamorphosis power, you can roll the die twice and use either roll.</p><p>In addition, after you make a manifestation test to</p><p>manifest a metamorphosis power, you can reroll the manifestation die and use either roll. You can reroll a number of manifestation tests equal to your Intelligence modifier (minimum one test), regaining all uses when you finish a long rest. You can use this feature only once for a single manifestation test.</p>
