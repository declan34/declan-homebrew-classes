    value: <p>10th-level Metamorph Feature</p><p>By expending psionic energy, you return a dead creature to life. After spending | hour concentrating on and touching the remains of a creature that died within the last 8 hours, you gain 8 strain, and the creature returns to life with | hit point. Any poisons or diseases that affected the creature when they died are neutralized or cured when they return to life. ‘This power closes all mortal wounds and restores any missing body parts.</p><p>Additionally, if you die and can gain 8 strain without surpassing your strain maximum, you gain 8 strain and your remains reform | hour after your death. When your remains reform, you return to life as above.</p><p>You can use this feature to return a creature to life (including yourself) once, regaining the ability to do so when you finish a long rest.</p>
