    value: <p>14th-level Pyrokinetic Feature</p><p>Channeling your pyrokinesis powers lets you set your enemies ablaze. Once per turn when you deal fire damage to a creature with a pyrokinesis power or your Flame On feature, you can make the target catch fire for 1 minute. While on fire, a target takes fire damage equal to twice your proficiency bonus at the start of each of their turns. At the end of each of their turns, a target can make a Dexterity saving throw against your talent power save DC, extinguishing the fire on themself on a success.</p><p>22 RESOPATH</p><p>Through sheer force of will, you create and reshape objects and creatures, literally making your dreams and your enemies’ nightmares come true. Resopaths are sometimes called makers, and those who enter the Resopath specialization do so at the Academy of Creation.</p>
