    value: <p>2nd-Level Talent Feature</p><p>You choose a psionic specialization based on the</p><p>specialty that is the focus of your academy. Each specialization—Chronopath, Metamorph, Pyrokinetic, Resopath, Telekinetic, or Telepath—grants you unique features that reflect your training. Alternatively, if your character has eschewed the focused training of an academy, you can choose the Maverick specialization. Your choice of specialization grants you features</p><p>when you choose it at 2nd level and again at 6th, 10th, and 14th level.</p>
