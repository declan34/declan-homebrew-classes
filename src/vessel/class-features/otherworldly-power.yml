    value: <p>Within every Vessel is bound an extraplanar being of strange and wondrous power. No matter their origin, these immortal Spirits cannot be killed by conventional means. Instead, they are often bound to mortal flesh, forced to dwell within a body on the material plane. While many such Spirits are bound to their Vessel against their will, some choose to dwell within a mortal, lending them power in causes that align with theirs. No matter the reason, these otherworldly beings are the source of the power for the adventurers known as Vessels.</p>
