system:
  description:
    value: '<p>A rare occurrence in most worlds, mortal Vessels will likely never meet another of their kind unless they seek them out. The binding of an otherworldly Spirit is a deadly task, and is almost always done by a higher power or legendary mortal. Bearers of this extraplanar power can learn to channel the wondrous abilities of the Spirit inside them. Through their force of will, they can allow small amounts of this power out, channeling it to defend themselves, produce eldritch magic, enhance their physical abilities, and influence friend and foe. However, the mark of a true Vessel is their ability to take on the appearance of the Spirit bound to their soul, known as an Archon Form. Through this wondrous transformation, they are able to directly wield the power of the Spirit within, and Creating Your Vessel When creating a Vessel, the most important thing to consider is how you came to be bound to the Spirit within you. Are you an Acolyte of a god, chosen to bear one of its angels that has fallen from grace? Are you a prophetic child of a cult, forced to bear the sinister power of their infernal lord? Or, are you descended from a bloodline of Vessels, each parent passing the Spirit on to their child when they have reached old age? Secondly, consider the nature of your Sealed Spirit and its relationship to you. Does your Spirit communicate with you freely, hoping that your goals will align? Is your Spirit bound against its will and seeking your demise so it can once again be free? Or, is the nature of your Sealed Spirit a mystery that you have struck out into the world to uncover more about? Multiclassing and the Vessel If your group uses the optional multiclassing rule, here''s what you need to know if you choose to take your first level in the Vessel class. Ability Score Minimum. As a multiclass character, you must have at least a Constitution and Charisma score of 13 to take your first level as a Vessel, or to take a level in another class if you are a Vessel. Proficiencies. If Vessel isn''t your initial class, here are the proficiencies you gain when you take your first Vessel level: light armor and simple weapons Spellcasting. If you have a feature from another class that allows you to learn and cast spells, you can use your Vessel Magic spell slots to cast the spells you gained through that feature, and you can use those spell slots to cast your Vessel spells. The Vessel Level    PB  Features 1st     +2   Spirit Mantle, Unsealed Aspects                1          —         —       —       — 2nd     +2   Vessel Magic                                   2          2          2       2     1st 3rd     +2   Sealed Spirit, Archon Form                     2          2          2       2     1st 4th     +2   Ability Score Improvement                      3          3          3       2     1st 5th     +3   Extra Attack                                   3          3          3       2     2nd 6th     +3   Sealed Spirit Feature                          3          3          4       2     2nd 7th     +3   Controlled Transformation                      4          3          4       2     2nd 8th     +3   Ability Score Improvement                      4          3          5       2     2nd 9th     +4   ─                                              4          3          5       2     3rd 10th    +4   Primeval Will                                  5          3          6       2     3rd 11th    +4   Elder Archon                                   5          4          6       3     3rd 12th    +4   Ability Score Improvement                      5          4          7       3     3rd 13th    +5   ─                                              5          4          7       3     4th 14th    +5   Dire Preservation                              6          4          8       3     4th 15th    +5   Sealed Spirit Feature                          6          4          8       3     4th 16th    +5   Ability Score Improvement                      6          4          9       3     4th 17th    +6   ─                                              6          4          9       4     5th
      18th    +6   Unchained Power                                7          4         10       4     5th 19th    +6   Ability Score Improvement                      7          4         10       4     5th 20th    +6   Sealed Spirit Feature                          7          4         11       4     5th Class Features Hit Points Hit Dice: 1d10 per Vessel level Hit Points at 1st Level: 10 + your Constitution modifier. Hit Points at Higher Levels: 1d10 (or 6) + your Constitution modifier per Vessel level after 1st Proficiencies Armor: Light armor Weapons: Simple weapons, scimitars, and shortswords Tools: None Saving Throws: Constitution, Charisma Skills: Choose two of the following: Acrobatics, Athletics, Insight, Intimidation, Perception, Religion, and Survival Equipment As a Vessel, you start with the following equipment, along with the equipment granted to you by your background: (a) a scimitar or (b) two daggers (a) a simple weapon or (b) a shortbow and 20 arrows (a) an explorer’s pack or (b) a priest''s pack leather armor and a quarterstaff Quick Build You can make a Vessel quickly with these suggestions. First, make Charisma your highest ability score, followed by your Constitution. Second, choose the Acolyte background. Last, Unsealed Cantrips Spells Spell Slot Aspects Known Known Slots Level</p>'
