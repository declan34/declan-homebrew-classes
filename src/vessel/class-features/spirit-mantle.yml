system:
  description:
    value: '<p>At 1st level, you can use a bonus action to cloak yourself with (or dismiss) your Spirit Mantle, an ethereal cloak of spiritual power. It marks a dramatic change in your appearance which causes you to resemble the Spirit bound to your soul. While cloaked in your Mantle, you gain the features here: <strong>Ethereal Armor.</strong> The power of your Mantle wards you from harm. When you are not wearing armor or a shield, your Armor Class is equal to 10 + your Constitution modifier + your Charisma modifier. <strong>Your Sealed Spirit &amp; You!</strong> To some Vessels, the nature of their Sealed Spirit is a mystery, while others are aware of its true nature. Though Vessels do not select their Sealed Spirit until 3rd level, if you know the nature of your Spirit,</p>'
