  description:
    value: <p>6th-level Trickster Spirit feature Your Spirit projects potent illusions to attack your enemies. Whenever you would make an Iridescent Strike during your turn, you can forgo that attack to conjure one illusory copy of yourself in an unoccupied space you can see within 30 feet of you. This illusory copy of you makes one Iridescent Strike against a target within range and disappears.</p>
