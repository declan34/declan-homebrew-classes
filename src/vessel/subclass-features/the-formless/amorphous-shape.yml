  description:
    value: <p>3rd-level Formless Spirit feature The oozing Spirit bound to your soul allows you to reshape yourself in unnatural ways. While cloaked in your Spirit Mantle, you can move through gaps as narrow as 1-inch without squeezing. This has no effect on what you are wearing or carrying. You also gain the Ethereal Tendril Aspect. It does not count against your total number of Unsealed Aspects and it cannot be replaced with another Unsealed Aspect. If you already unlocked Ethereal Tendril, you unlock another Unsealed Aspect of your choice.</p>
