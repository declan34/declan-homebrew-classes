system:
  description:
    value: <p>As an action, you can protrude (or retract) a single Ethereal Tendril, which resembles your Spirit Mantle, from any point on your body. It has a reach of 10 feet and its Strength score equals your Charisma score. You can only have one Tendril manifested at a time, and it can be attacked as part of you. When cloaked in your Spirit Mantle, its reach is doubled. This Tendril cannot manipulate fine tools or use weapons or shields. However, it can manipulate simple objects, and be used to make Iridescent Strikes, Shoves, or Grapples.</p>
