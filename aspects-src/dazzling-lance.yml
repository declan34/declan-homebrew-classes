    value: '<p>You can project overwhelming spiritual power. When you use Shimmering Lance, its range becomes (100/300), it ignores half-cover, and treats three-quarters cover as half. In addition, when you hit with a ranged Iridescent Strike, you can expend a Vessel Magic spell slot to create a spiritual eruption. Creatures within 30 feet of the target must make a Dexterity saving throw. They take 6d8 damage of the type of an Iridescent Strike on a failure, and half on a success. As you gain Vessel levels the damage of this eruption on impact increases: at 13th level (7d8) and 17th level (8d8).</p>'
