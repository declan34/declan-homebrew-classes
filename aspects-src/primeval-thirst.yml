  description:
    value: <p>The primeval Spirit within you can absorb spells to restore its power. When you see a creature within 30 feet cast a spell while you are in Archon Form, you can use a reaction to force the caster to make a saving throw with its Spellcasting ability. On a failure, its spell fails, and if the spell was of a level equal to your Slot Level or higher, you regain one spell slot. You can use this reaction a number of times equal to your Charisma modifier (a minimum of once), and you regain all expended uses when you finish a long rest.</p>
