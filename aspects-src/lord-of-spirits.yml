system:
  description:
    value: <p>You can channel the elder authority of your Spirit to conjure servile entities. As an action, you can conjure one creature of CR 6 or lower, that is of the same type as your Archon Form that you can see before. It appears in an unoccupied space of your choice within 30 feet and remains for up to 1 hour. For the duration, it is absolutely loyal to you and obeys your orders completely, so long as they do not violate its nature. In combat, it shares your initiative and acts during your turn. Once you use this feature you must complete a long rest before you can conjure another creature in this way again.</p>
