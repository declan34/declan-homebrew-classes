    value: <p>You reveal a fraction of your Spirit's true power, horrifying all who behold you. When you transform into Archon Form, you can force creatures of your choice that can see you within 60 feet to make a Wisdom saving throw. On a failed save, they are Frightened of you for 1 minute. Creatures can repeat this saving throw at the end of each of their turns, ending the effect on a success. If it can still see your Archon Form, it has disadvantage on its saving throw.</p>
