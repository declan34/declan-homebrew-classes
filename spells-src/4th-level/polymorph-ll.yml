name: Polymorph (LL)
system:
  description:
    value: '<p>4th-level Transmutation</p><p>Classes: Druid, Magus, Sorcerer, Vessel, Warlock, Wizard</p><p>Casting Time: 1 action</p><p>Range: 30 feet</p><p>Components: V, S, M (a caterpillar cocoon)</p><p>Duration: Concentration, up to 10 minutes</p><p>You attempt to transform a creature you can see within range into a Beast using the rules below. An unwilling target makes a Charisma saving throw to resist this effect. Shapechangers automatically succeed on this saving throw.</p><p>Form. The new form can be any living Beast you have seen before. Creatures can only be transformed into a Beast with a CR equal to (or lower then) half its level or CR.</p><p>Statistics. The creature''s game statistics are replaced by those of the Beast. However, while transformed, it retains its alignment, personality, its Hit Points, and Charisma score.</p><p>Actions. The creature can only take the actions that would be available to that Beast. It cannot speak, cast spells, or take any actions that require hands or speech.</p><p>Equipment. Its clothing, weapons, armor, and objects it is holding meld into the new form. However, it can''t activate, use, wield, or otherwise benefit from any of its equipment.</p><p>Reverting. The creature instantly reverts to its true form if it is reduced to 0 hit points. It can also repeat this Charisma saving throw at the end of each of its turns, reverting to its true form on a successful save.</p><p>At Higher Levels. When you cast this spell with a slot of 5th-level or higher, you can target one additional creature for each slot level above 4th. You can choose the Beast that you transform each target into individually.</p>'
