name: Eldritch Tentacles (LL)
system:
  description:
    value: '<p>4th-level Conjuration</p><p>Classes: Vessel, Warlock</p><p>Casting Time: 1 action</p><p>Range: 90 feet</p><p>Components: V, S, M (a piece of tentacle from a giant squid)</p><p>Duration: Concentration, up to 1 minute</p><p>Alien tentacles fill a 20-foot square on the ground you can see within range. For the duration, this area is difficult terrain.</p><p>When a creature enters this area for the first time on a turn or starts its turn there, it must succeed on a Dexterity saving throw or take 3d6 bludgeoning damage and be restrained by the tentacles until the spell ends. Any creature that begins its turn in the area and is restrained by the tentacles takes 3d6 bludgeoning damage at the start of its turn.</p><p>A creature restrained by the tentacles can use its action to make a Strength or Dexterity check (its choice) against your spell save DC. On a success, it frees itself from the tentacles.</p><p>At Higher Levels. When you cast this spell using a spell slot of 5th level or higher, both instances of damage from this spell increase by 1d6 for each slot level above 4th.</p>'
