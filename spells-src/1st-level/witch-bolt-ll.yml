name: Witch Bolt (LL)
system:
  description:
    value: <p>A beam of crackling energy lances out toward a creature within range, forming a sustained arc of lightning between you and the target. Make a ranged spell attack against that creature. On a hit, the target takes 1d12 lightning damage, and neither you nor the target can move more than 30 feet away from each other while this spell lasts.</p><p>You can use an action on each subsequent turn to deal an additional 1d12 lighting damage to the creature. A creature can attempt to move beyond the range of the spell by using its action to make a Strength check against your Spell save DC. If another creature attempts to move the target of this spell beyond the range of this spell it can use its action to make a Strength check against your Spell save DC. Any attempts by the target or another creature (magical or mundane) to move the target beyond this range automatically fail.</p><p>The spell immediately ends if you are forced to move more than 30 feet away from the target of this spell.</p><p>At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, both the initial and subsequent damage increases by 1d12 for each slot level above 1st.</p>
