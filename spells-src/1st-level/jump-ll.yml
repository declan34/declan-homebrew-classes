    value: '<p>1st-level Transmutation</p><p>Classes: Artificer, Druid, Magus, Psion, Ranger, Sorcerer, Vessel, Warlock, Wizard</p><p>Casting Time: 1 bonus action</p><p>Range: Touch</p><p>Components: V S M (A grasshopper''s hind leg)</p><p>Duration: 1 minute</p><p>You touch a willing creature and greatly alter its buoyancy. Once on each of its turns until the spell ends, the target can spend 10 feet of its movement to jump up to 30 feet.</p><p>At Higher Levels. When you cast this spell using a spell slot of 2nd-level or higher, the distance of this magical jump increases by 10 feet for each slot level above 1st.</p>'
