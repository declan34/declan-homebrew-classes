name: Spectral Passage (LL)
system:
  description:
    value: <p>You touch a willing creature. Until the spell ends, it becomes semi-incorporeal and can move through other creatures and objects as if they were difficult terrain. If the creature ends its movement inside another object or creature, it is immediately shunted to the nearest unoccupied space, taking 1d10 force damage for every 5 feet it was forced to travel.</p><p>At Higher Levels. When you cast this spell using a spell slot of 4th-level or higher, you can target one additional creature for each slot level above 3rd.</p>
