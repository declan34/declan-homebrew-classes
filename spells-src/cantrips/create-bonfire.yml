name: Create Bonfire
system:
  description:
    value: <p>You create a bonfire on the ground at a point within range. The bonfire fills a 5-foot-radius area and is heavily obscured. It lasts for 1 minute. The bonfire is a source of light, but it provides no warmth.</p><p>Any creature that starts its turn in the bonfire's area takes 1d8 Fire damage. A creature can take this damage only once per turn.</p>
