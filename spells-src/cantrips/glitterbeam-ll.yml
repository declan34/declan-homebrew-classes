name: Glitterbeam (LL)
system:
  description:
    value: '<p>You project a beam of twinkling lights at a creature or object within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 radiant damage. Until the start of your next turn, the creature emits bright light in a 10-foot radius and has disadvantage on Stealth checks to Hide.</p><p>At Higher Levels. The damage of this spell increases by 1d8 at 5th (2d8), 11th (3d8), and 17th level (4d8).</p>'
