name: Dancing Lights
system:
  description:
    value: <p>You create up to four torch-sized lights within range, making them appear as torches, lanterns, or glowing orbs that last for the duration. As a bonus action on your turn, you can move the lights up to 30 feet to a new spot within range.</p><p>Each light produces dim light in a 10-foot radius. When you cast this spell, you can have the lights produce a sound as well, such as the crackling of flames or the ticking of a clock. The sound is constant and can be anything you choose.</p>
