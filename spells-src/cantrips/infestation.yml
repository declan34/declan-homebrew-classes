system:
  description:
    value: <p>You cause a swarm of insects to appear at a point within range. The swarm fills a 10-foot-radius area and lasts for 1 minute.</p><p>Each creature in the area must make a Constitution saving throw. On a failed save, the creature takes 1d6 Poison damage and is poisoned until the end of your next turn. On a successful save, the creature takes half damage and isn't poisoned.</p>
